      @media (max-width: 600px) {
        .shell-dino-stage {
          transform: scale(0.9);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .shell-dino-pixel {
          animation: none !important;
        }
        .shell-dino-container {
          animation: none !important;
          transform: none !important;
        }
        .shell-dot {
          animation: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </head>
